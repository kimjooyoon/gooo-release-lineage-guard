name: PR plan gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  authoritative-go-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the proposed history
        uses: actions/checkout@v4
      - name: Install Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Run the repository's Go checks
        run: |
          go test ./...
          go build ./...
          go vet ./...
      - name: Regenerate plan-gate artifacts from the .gooo authority
        run: go run ./cmd/gooo-release-lineage-guard generate --source semantic/release-lineage.gooo --fixtures fixtures/cases --out generated
      - name: Exercise the CLOSED plan gate
        run: go run ./cmd/gooo-release-lineage-guard plan-gate --source semantic/release-lineage.gooo --fixture fixtures/cases/01-closed-annotated-draft.json
      - name: Inspect the fixed inventory
        run: go run ./cmd/gooo-release-lineage-guard inventory --root . --out generated/inventory.json
      - name: Require generated artifacts to be committed
        run: git diff --exit-code -- generated
